<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121b2f;--panel2:#18243b;--stroke:#2a3952;--muted:#9cacbf;--ink:#f0f5ff;--a:#80b9ff;--teal:#62dfc7;--bad:#ff8192;--gold:#ffd38b}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 80% -10%,#172a4b 0,transparent 40%),var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--stroke);border-radius:11px;background:var(--panel2);padding:10px 15px}button:hover:not(:disabled){border-color:var(--a)}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:linear-gradient(100deg,#3987de,#248a9b);border-color:transparent;font-weight:700}.ghost{background:transparent}.danger{color:var(--bad)}.app{max-width:1170px;margin:auto;padding:23px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--teal)}.muted{color:var(--muted)}.pill{border:1px solid var(--stroke);padding:5px 11px;border-radius:50px;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:24px;margin-top:27px}.sidebar{display:flex;flex-direction:column;gap:7px}.nav{width:100%;text-align:left;border-color:transparent;background:transparent;padding:13px}.nav.active{background:var(--panel2);border-color:var(--stroke);color:var(--a)}.nav.lock{opacity:.5}.card{background:var(--panel);border:1px solid var(--stroke);border-radius:17px;padding:24px;margin-bottom:17px;box-shadow:0 12px 32px #0002}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);font-weight:800}h1{font-size:clamp(26px,4vw,39px);line-height:1.15;margin:7px 0 12px;letter-spacing:-1.2px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}p{margin:8px 0 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px;border:1px solid var(--stroke);background:var(--panel2);border-radius:13px}.stat b{display:block;font-size:24px}.stat small{color:var(--muted)}.progress{background:#27364a;border-radius:20px;height:8px;overflow:hidden;margin:11px 0}.progress>div{height:100%;background:linear-gradient(90deg,#5197ff,#65dec7);transition:width .2s}.lesson{border-left:3px solid var(--teal);padding:4px 15px;background:#182838;margin:17px 0;border-radius:0 8px 8px 0}.tag{display:inline-block;border:1px solid var(--stroke);background:#192843;border-radius:6px;font-size:11px;padding:3px 8px;margin:0 5px 5px 0;color:#b9d2fb}.answer{width:100%;border:1px solid #40536e;border-radius:12px;background:#0b1425;color:var(--ink);padding:13px 14px;outline:none;resize:vertical;min-height:52px}.answer:focus{border-color:var(--a)}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}.feedback{border-radius:12px;border:1px solid var(--stroke);padding:15px;margin-top:17px;white-space:normal}.feedback.good{border-color:#317b70;background:#102e30}.feedback.bad{border-color:#874458;background:#33202e}.feedback.neutral{background:#1a2840}.equation{font-size:21px;margin:20px 0}.mini{font-size:12px;color:var(--muted)}.katex-display{overflow-x:auto;overflow-y:hidden;padding:5px}.segments{display:flex;gap:6px;flex-wrap:wrap;margin-top:15px}.segments button{font-size:12px}.segments .sel{color:var(--teal);border-color:var(--teal)}.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.boxgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.topic{padding:16px;background:var(--panel2);border:1px solid var(--stroke);border-radius:12px}.topic.locked{opacity:.55}.topic h3{margin:3px 0}.timer{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:var(--gold)}.smallbtn{padding:5px 10px;font-size:12px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{font-size:12px;padding:12px;background:var(--panel2);border:1px solid var(--stroke);border-radius:10px}.step.done{border-color:#438a7e}.step.now{border-color:var(--a)}.bar{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--stroke);padding:11px 0}.bar:last-child{border:0}.pill.ok{color:var(--teal)}.pill.warn{color:var(--gold)}.hidden{display:none!important}.footer{color:var(--muted);font-size:12px;margin-top:30px}.notice{background:#182739;border:1px solid #314b66;border-radius:12px;padding:12px}.question{font-size:18px;line-height:1.7;white-space:pre-line}.kbd{font-family:monospace;color:var(--teal)}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{flex-direction:row;overflow-x:auto;padding-bottom:6px}.nav{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.boxgrid{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.card{padding:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app"><header class="top"><div class="brand">COMC <span>FORGE</span> <span class="pill">2026 prep</span></div><div class="split"><span class="pill" id="saveLabel">Saved locally</span><button class="smallbtn ghost" id="resetBtn">Reset progress</button></div></header><div class="layout"><nav class="sidebar" id="nav"></nav><main id="main" aria-live="polite"></main></div><footer class="footer">Original COMC-style exercises; not official COMC questions or official marking. KaTeX loads from CDN; internet is needed for typesetting. Your progress stays in this browser (localStorage). No account or backend required.</footer></div>
<script>
'use strict';
const KEY='comc-forge-v1';const modules=[{id:'recognition',name:'01 · Pattern recognition',mins:30,threshold:90,need:24,description:'Identify the hidden structure quickly. Typed technique + first move; no multiple choice.'},{id:'counting',name:'02 · Counting + number theory',mins:45,threshold:85,need:12,description:'Construct full numerical answers with explanations.'},{id:'geometry',name:'03 · Geometry + algebra',mins:40,threshold:85,need:10,description:'Use transformations, coordinates and geometry theorems.'},{id:'proof',name:'04 · C-level strategy',mins:35,threshold:80,need:8,description:'Explain proof ideas, not just a number.'},{id:'exam',name:'05 · Timed assessment',mins:30,threshold:85,need:4,description:'Unseen A/B-style prompts, on the clock.'}];
const concepts=[
{id:'mod',name:'Modular arithmetic',syn:['mod','congruen','remainder','residue','period','cycle'],trigger:'Huge powers or remainder on division',first:'Reduce the base modulo the divisor, then find a short power cycle.',example:'$7^{2026}$ modulo $13$'},
{id:'stars',name:'Stars and bars',syn:['stars','bars','integer solutions','nonnegative solutions','shift variables'],trigger:'Number of nonnegative solutions of a sum',first:'Shift lower bounds to zero; choose dividers between stars.',example:'$a+b+c=17$ with $a,b,c\\ge0$'},
{id:'ie',name:'Inclusion–exclusion',syn:['inclusion','exclusion','overlap','subtract intersections'],trigger:'At least one forbidden/overlapping property',first:'Count the universe, subtract forbidden cases and add overlaps.',example:'Count integers divisible by $2$ or $3$'},
{id:'complement',name:'Complement counting',syn:['complement','subtract bad','total minus'],trigger:'Hard to count valid objects, easy to count invalid ones',first:'Count all arrangements minus the forbidden configurations.',example:'No two $B$s adjacent'},
{id:'binom',name:'Binomial coefficient',syn:['binomial','choose','combination','select positions'],trigger:'Choose fixed locations or orders of two step types',first:'Choose which step positions are of one type; check boundaries.',example:'8 R moves and 5 L moves'},
{id:'double',name:'Double counting',syn:['double count','count in two ways','count pairs'],trigger:'Pairs, incidences, edges, or two descriptions of a set',first:'Count the same objects from two different viewpoints.',example:'Handshake lemma in a graph'},
{id:'pigeon',name:'Pigeonhole principle',syn:['pigeon','boxes','guarantee','ceil'],trigger:'Prove some two objects share a category',first:'Define categories (boxes) and compare objects with boxes.',example:'13 people and 12 birth months'},
{id:'invariant',name:'Invariant',syn:['invariant','parity invariant','unchanged'],trigger:'Repeated operation; ask if target is reachable',first:'Test quantities that stay fixed after every legal move.',example:'Move tokens while preserving parity'},
{id:'monovariant',name:'Monovariant',syn:['monovariant','decreases','increases','potential function'],trigger:'Prove a process terminates',first:'Find an integer-valued quantity that strictly decreases.',example:'A decreasing sum of squared differences'},
{id:'game',name:'Winning/losing positions',syn:['winning','losing','backward induction','game theory','mirroring','strategy'],trigger:'Two players alternate legal moves; no moves means defeat',first:'Classify terminal states, then work backwards; seek a reply to every move.',example:'Two decreasing exponents'},
{id:'vieta',name:'Vieta’s formulas',syn:['vieta','sum of roots','product of roots'],trigger:'Quadratic roots without explicit formulas',first:'Relate the root sum and product to coefficients.',example:'$x^2-7x+10$'},
{id:'disc',name:'Discriminant',syn:['discriminant','b^2-4ac','no real roots'],trigger:'Number of real roots of a quadratic',first:'Inspect $b^2-4ac$ and its sign.',example:'$x^2+ax+4$ has no real zeros'},
{id:'similar',name:'Similar triangles',syn:['similar','aa similarity','angle angle','corresponding sides'],trigger:'Ratios of sides and equal angles',first:'Mark angles; find two triangles with two matching angles.',example:'Line parallel to one side of triangle'},
{id:'circum',name:'Circumcentre',syn:['circum','perpendicular bisector','equidistant','midpoint of hypotenuse'],trigger:'Point equally distant from 3 vertices',first:'Intersect perpendicular bisectors; for a right triangle use hypotenuse midpoint.',example:'Three points on a circle'},
{id:'parity',name:'Parity',syn:['parity','odd','even','mod 2'],trigger:'Odd/even restrictions or alternating moves',first:'Reduce the quantities modulo $2$.',example:'Sum of odd integers'},
{id:'factor',name:'Factoring',syn:['factor','difference of squares','product','factorization'],trigger:'Integer equation with products/differences of squares',first:'Rearrange into a product of integer factors.',example:'$x^2-y^2=45$'},
{id:'finite',name:'Finite differences',syn:['finite difference','differences','binomial basis','integer valued polynomial'],trigger:'Polynomial evaluated at consecutive integers',first:'Take repeated finite differences; exploit degree.',example:'Integer-valued polynomial coefficients'},
{id:'coordinates',name:'Coordinate geometry',syn:['coordinate','distance formula','slope','equation of line'],trigger:'Locations or equal distances specified by coordinates',first:'Write squared distances; subtract to cancel quadratics.',example:'Equidistant from $(0,0),(6,0),(0,8)$'}
];
const store=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();const state={view:'home',step:0,question:null,revealed:false,answer:'',hint:0,attempts:0,stamp:Date.now(),seed:1,...store};state.records ||= {};state.seen ||= {};state.sessions ||= {};state.locked ||= {};let clock=null;let ticks=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({step:state.step,records:state.records,seen:state.seen,sessions:state.sessions,seed:state.seed}))}catch{document.getElementById('saveLabel').textContent='Storage unavailable'}}
function hash(s){let h=2166136261;for(const c of s){h=Math.imul(h^c.charCodeAt(0),16777619)}return h>>>0}function rand(seed){let z=(seed+0x6D2B79F5)>>>0;return function(){z|=0;z=z+0x6D2B79F5|0;let t=Math.imul(z^z>>>15,1|z);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}function ir(r,a,b){return a+Math.floor(r()*(b-a+1))}function choose(n,k){if(k<0||k>n)return 0;k=Math.min(k,n-k);let a=1;for(let i=1;i<=k;i++)a=a*(n-k+i)/i;return Math.round(a)}function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function powmod(a,b,m){let v=1;while(b){if(b%2)v=v*a%m;a=a*a%m;b=Math.floor(b/2)}return v}function html(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function latex(){if(window.renderMathInElement)renderMathInElement(document.getElementById('main'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}function pct(x){return Math.round(x)}function rec(id){return state.records[id]||{n:0,score:0,recent:[],correct:0}}function mastery(id){let r=rec(id);return r.recent.length?Math.round(r.recent.reduce((a,b)=>a+b,0)/r.recent.length):0}function passed(i){let m=modules[i],r=rec(m.id);return r.n>=m.need&&r.recent.length>=Math.min(m.need,10)&&mastery(m.id)>=m.threshold}function unlocked(i){return i===0||passed(i-1)}function progress(m){let r=rec(m.id);return Math.min(100,Math.round(100*r.n/m.need))}function nav(){document.getElementById('nav').innerHTML=`<button class="nav ${state.view==='home'?'active':''}" data-view="home">⌂ &nbsp; Overview</button>${modules.map((m,i)=>`<button class="nav ${state.view===m.id?'active':''} ${unlocked(i)?'':'lock'}" data-view="${m.id}" ${unlocked(i)?'':'disabled'}>${html(m.name)} ${passed(i)?'✓':''}</button>`).join('')}<button class="nav ${state.view==='library'?'active':''}" data-view="library">▤ &nbsp; Technique library</button><button class="nav ${state.view==='history'?'active':''}" data-view="history">▥ &nbsp; Performance</button>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.question=null;state.revealed=false;render()})}
function home(){let total=modules.reduce((s,m)=>s+rec(m.id).n,0);return `<div class="card"><div class="eyebrow">Training dashboard</div><h1>Build contest instincts,<br>not solution memory.</h1><p class="muted">Five locked stages · three hours of guided practice · unlimited parameterized variations. Each stage requires a high recent score before the next opens.</p><div class="stats"><div class="stat"><b>${total}</b><small>Attempts recorded</small></div><div class="stat"><b>${modules.filter((m,i)=>passed(i)).length}/5</b><small>Stages mastered</small></div><div class="stat"><b>${Math.round(modules.reduce((s,m)=>s+mastery(m.id),0)/5)}%</b><small>Average recent score</small></div><div class="stat"><b>${Object.keys(state.seen).length}</b><small>Unique variants seen</small></div></div></div><div class="card"><h2>Today's 180-minute path</h2><div class="steps">${modules.map((m,i)=>`<div class="step ${passed(i)?'done':state.step===i?'now':''}"><b>${m.mins} min</b><br>${html(m.name.slice(5))}<br><span class="mini">${passed(i)?'Mastered':unlocked(i)?'Available':'Locked'}</span></div>`).join('')}</div><p class="notice">Mastery: score at least <b>90%</b> on rapid recognition, then <b>85%</b> on problem-solving blocks (80% on proof strategies). The last 10 scored attempts determine your current mastery percentage. Wrong answers count; using a hint lowers the score.</p>${modules.map((m,i)=>`<div class="bar"><div><b>${html(m.name)}</b><div class="mini">${html(m.description)}</div><div class="progress"><div style="width:${progress(m)}%"></div></div><span class="mini">${rec(m.id).n}/${m.need} minimum attempts · recent ${mastery(m.id)}% · required ${m.threshold}%</span></div><button data-open="${m.id}" ${unlocked(i)?'':'disabled'}>${passed(i)?'Review':unlocked(i)?'Train':'Locked'}</button></div>`).join('')}</div>`}
function library(){return `<div class="card"><h1>Technique library</h1><p class="muted">These are recognition triggers, not a rigid decision tree. Questions can use more than one technique.</p><div class="boxgrid">${concepts.map(c=>`<div class="topic"><h3>${html(c.name)}</h3><div class="tag">Trigger</div><p>${html(c.trigger)}</p><div class="tag">First move</div><p>${html(c.first)}</p><span class="mini">Example: ${c.example}</span></div>`).join('')}</div></div>`}
function history(){return `<div class="card"><h1>Performance</h1><p class="muted">Recent mastery uses your latest 10 attempts. Hints cost points, and attempting an explanation is required in the proof module.</p>${modules.map((m,i)=>`<div class="bar"><div><b>${html(m.name)}</b><p class="mini">${rec(m.id).n} attempts · ${rec(m.id).correct} full-credit answers · ${unlocked(i)?'unlocked':'locked'}</p></div><div><b>${mastery(m.id)}%</b> <span class="pill ${passed(i)?'ok':'warn'}">${passed(i)?'Passed':'Need '+m.threshold+'%'}</span></div></div>`).join('')}<p class="notice">If stuck, give a first move and use a hint. Then complete the problem yourself; don't just read its solution. A stage only unlocks when your *recent* accuracy stays high.</p></div>`}
// Question generators: each produces an original, checkable, parameterized exercise.
const generators={
mod(r){let m=[7,11,13,17,19][ir(r,0,4)],a=ir(r,2,m-2),e=ir(r,50,1500);return {topic:'Modular arithmetic',prompt:`Find the remainder when $${a}^{${e}}$ is divided by $${m}$.`,answer:String(powmod(a,e,m)),hint:'Look for a repeating cycle of powers modulo the divisor.',solution:`Reduce powers of $${a}$ modulo $${m}$, then use their period (or fast repeated squaring) to compute $${a}^{${e}}\\bmod ${m}=${powmod(a,e,m)}$.`,skill:'mod'}},
stars(r){let k=ir(r,3,6),sum=ir(r,12,32),lo=ir(r,1,4),n=sum-k*lo;return {topic:'Stars and bars',prompt:`How many ordered $${k}$-tuples of integers $(x_1,\\ldots,x_${k})$ satisfy $x_1+\\cdots+x_${k}=${sum}$ and $x_i\\ge ${lo}$ for every $i$?`,answer:String(choose(n+k-1,k-1)),hint:'Subtract the lower bound from each variable first.',solution:`Set $y_i=x_i-${lo}$. Then $\\sum y_i=${n}$ with $y_i\\ge0$. The count is $\\binom{${n+k-1}}{${k-1}}=${choose(n+k-1,k-1)}$.`,skill:'stars'}},
complement(r){let a=ir(r,3,6),b=ir(r,2,4),total=a+b;let all=choose(total,b),bad=choose(total-1,b-1);return {topic:'Complement counting',prompt:`A row contains $${a}$ identical A tiles and $${b}$ identical B tiles. How many distinct arrangements have NO two B tiles adjacent?`,answer:String(choose(a+1,b)),hint:'Place all the A tiles first and inspect the gaps between them.',solution:`The $${a}$ A tiles create $${a+1}$ gaps. Put at most one B in each gap, choosing $${b}$ gaps: $\\binom{${a+1}}{${b}}=${choose(a+1,b)}$.`,skill:'complement'}},
paths(r){let right=ir(r,4,10),left=ir(r,2,Math.min(6,right)),n=right+left;return {topic:'Lattice-path counting',prompt:`A token makes exactly $${right}$ right-up moves and $${left}$ left-up moves. With NO board boundaries, how many distinct sequences of moves are possible?`,answer:String(choose(n,left)),hint:'Choose which positions in the full move sequence are left moves.',solution:`Choose $${left}$ of the $${n}$ positions for left moves: $\\binom{${n}}{${left}}=${choose(n,left)}$.`,skill:'binom'}},
parity(r){let n=ir(r,20,100),goal=ir(r,0,1);return {topic:'Parity',prompt:`How many integers from $1$ to $${n}$ inclusive have remainder $${goal}$ upon division by $2$?`,answer:String(goal?Math.ceil(n/2):Math.floor(n/2)),hint:'Pair consecutive integers into odd-even pairs.',solution:`Among the first $${n}$ integers, there are $${Math.ceil(n/2)}$ odd and $${Math.floor(n/2)}$ even integers. Therefore ${goal?Math.ceil(n/2):Math.floor(n/2)}.`,skill:'parity'}},
factor(r){let x=ir(r,7,27),y=ir(r,1,x-2);let D=x*x-y*y;return {topic:'Integer factorization',prompt:`Find the value of $x^2-y^2$ if $x=${x}$ and $y=${y}$. Use factoring rather than squaring both terms.`,answer:String(D),hint:'Recognize the difference of two squares.',solution:`$x^2-y^2=(x-y)(x+y)=(${x}-${y})(${x}+${y})=${D}$.`,skill:'factor'}},
vieta(r){let a=ir(r,2,14),b=ir(r,1,12),s=a+b,p=a*b;return {topic:'Vieta',prompt:`The roots of $t^2-${s}t+${p}=0$ are $r,s$. Find $r^2+s^2$.`,answer:String(s*s-2*p),hint:'Express the sum of squares using the sum and product of the roots.',solution:`By Vieta, $r+s=${s}$ and $rs=${p}$. So $r^2+s^2=(r+s)^2-2rs=${s*s}-2(${p})=${s*s-2*p}$.`,skill:'vieta'}},
disc(r){let a=ir(r,1,9),c=ir(r,10,40),b=ir(r,0,20);let d=b*b-4*a*c;return {topic:'Discriminant',prompt:`For the quadratic $${a}x^2+${b}x+${c}$, compute its discriminant.`,answer:String(d),hint:'Use the coefficients of the quadratic, including their signs.',solution:`$\\Delta=b^2-4ac=${b}^2-4(${a})(${c})=${d}$. ${d<0?'Therefore it has no real roots.':d===0?'There is one repeated real root.':'There are two distinct real roots.'}`,skill:'disc'}},
circum(r){let w=2*ir(r,2,12),h=2*ir(r,2,12);return {topic:'Circumcentre',prompt:`Find the coordinates $(x,y)$ equally distant from $A=(0,0)$, $B=(${w},0)$, and $C=(0,${h})$. Enter as x,y.`,answer:`${w/2},${h/2}`,hint:'It is a right triangle; consider the midpoint of its hypotenuse.',solution:`The right angle is at $A$. Its circumcentre is the midpoint of $BC$, namely $(${w/2},${h/2})$.`,skill:'circum'}},
similar(r){let a=ir(r,2,10),k=ir(r,2,6),b=ir(r,3,15);return {topic:'Similar triangles',prompt:`Two similar triangles have corresponding sides $${a}$ and $${a*k}$. A second side in the smaller triangle is $${b}$. Find its corresponding side in the larger triangle.`,answer:String(b*k),hint:'Find the scale factor from the first pair of corresponding sides.',solution:`The scale factor is $${a*k}/${a}=${k}$, so the missing side is $${b}\\cdot ${k}=${b*k}$.`,skill:'similar'}},
coords(r){let x=ir(r,-9,9),y=ir(r,-9,9),dx=2*ir(r,2,9),dy=2*ir(r,2,9);return {topic:'Coordinate geometry',prompt:`A point $P=(u,v)$ is equally distant from $A=(${x},${y})$, $B=(${x+dx},${y})$, and $C=(${x},${y+dy})$. Find $u,v$ (comma-separated).`,answer:`${x+dx/2},${y+dy/2}`,hint:'Subtract the squared-distance equations to cancel $u^2$ and $v^2$.',solution:`The perpendicular bisectors of $AB$ and $AC$ meet at $(${x+dx/2},${y+dy/2})$.`,skill:'coordinates'}},
pigeon(r){let boxes=ir(r,5,18),n=ir(r,boxes+1,boxes*7);let ans=Math.ceil(n/boxes);return {topic:'Pigeonhole principle',prompt:`$${n}$ objects are placed into $${boxes}$ boxes. What is the minimum number that must be in at least one box?`,answer:String(ans),hint:'Imagine distributing the objects as evenly as possible.',solution:`By pigeonhole, one box has at least $\\lceil ${n}/${boxes}\\rceil=${ans}$ objects.`,skill:'pigeon'}},
inclex(r){let n=ir(r,70,360),a=[2,3,5,7][ir(r,0,3)],b=[3,5,7,11][ir(r,0,3)];if(a===b)b=11;let l=a*b/gcd(a,b),ans=Math.floor(n/a)+Math.floor(n/b)-Math.floor(n/l);return {topic:'Inclusion–exclusion',prompt:`How many integers between $1$ and $${n}$ inclusive are divisible by $${a}$ or $${b}$?`,answer:String(ans),hint:'Count multiples of each number and correct for double-counting.',solution:`There are $\\lfloor ${n}/${a}\\rfloor+\\lfloor ${n}/${b}\\rfloor-\\lfloor ${n}/${l}\\rfloor=${ans}$.`,skill:'ie'}},
comb(r){let n=ir(r,7,18),k=ir(r,2,Math.min(7,n-2));return {topic:'Choosing objects',prompt:`A committee of $${k}$ is chosen from $${n}$ distinct students. How many committees are there?`,answer:String(choose(n,k)),hint:'Order does not matter in a committee.',solution:`The answer is $\\binom{${n}}{${k}}=${choose(n,k)}$.`,skill:'binom'}},
handshakes(r){let n=ir(r,6,40);return {topic:'Double counting',prompt:`At a gathering of $${n}$ people, every pair shakes hands exactly once. How many handshakes occur?`,answer:String(choose(n,2)),hint:'Each handshake is an unordered pair of people.',solution:`Choose two people: $\\binom{${n}}2=${choose(n,2)}$. Or count $${n}( ${n}-1)$ person-participations and divide by $2$.`,skill:'double'}},
prob(r){let n=ir(r,5,12),k=ir(r,1,n-1),f=choose(n,k);return {topic:'Binomial counting',prompt:`How many length-$${n}$ binary strings contain exactly $${k}$ ones?`,answer:String(f),hint:'Select the positions containing ones.',solution:`Choose $${k}$ of $${n}$ positions: $\\binom{${n}}{${k}}=${f}$.`,skill:'binom'}},
geomArea(r){let b=2*ir(r,4,20),h=ir(r,4,22);return {topic:'Triangle geometry',prompt:`A triangle has base $${b}$ and perpendicular height $${h}$. Find its area.`,answer:String(b*h/2),hint:'Use the perpendicular height, not a slanted side.',solution:`The area is $\\frac12(${b})(${h})=${b*h/2}$.`,skill:'similar'}}
};
const genKeys=Object.keys(generators);
// Rapid prompts are procedurally varied and ask for the method, not the final result.
function recognitionQ(seed){let r=rand(seed),skill=concepts[ir(r,0,concepts.length-1)],v=ir(r,6,300),w=ir(r,3,100),k=ir(r,2,8),variant=ir(r,0,2);let prompts={mod:[`You need $${v}^{${w}}\\bmod ${[7,11,13][ir(r,0,2)]}$. Name the best technique.`,`A 600-digit integer must be divided by $9$; only its digits are known. Which tool?`,`Find the last digit of $${v}^{${w}}$. What should you look for?`],stars:[`Count nonnegative solutions of $a+b+c+d=${v}$. Name the method.`,`Integers $x_1+\\cdots+x_5=${v+20}$ each satisfy $x_i\\ge4$. What is the first technique?`,`Distribute $${v}$ identical candies among four labelled students. Name a counting method.`],ie:[`Count integers divisible by $3$ or $5$ from $1$ to $${v+100}$. What principle?`,`Count students participating in at least one of three overlapping clubs. Which principle?`,`Two forbidden properties overlap. What counting method handles the overlap?`],complement:[`Count arrangements of letters AAABBB where no B's are adjacent. Which general strategy?`,`Count $${v}$-digit binary strings that avoid an unwanted pattern. What might be easier to count?`,`A selection must NOT include two specified objects together. What counting shortcut?`],binom:[`A path has $${k}$ right moves and $${k+3}$ left moves. No boundaries. What counts orderings?`,`Choose the locations of $${k}$ identical upward moves among $${k+6}$ moves. What tool?`,`Select an unordered group of $${k}$ from $${v+10}$ students. What operation?`],double:[`Count edges in a graph by summing vertex degrees. What proof technique?`,`Every pair shakes hands once; count by pairs and by people. Name the method.`,`Count incidences of students and clubs from both viewpoints. What technique?`],pigeon:[`You have $${v+12}$ objects and only $${k}$ categories. Guarantee a collision. Name the principle.`,`Guarantee two students share a birth month in a group of 13. Name the theorem.`,`Guarantee one box has many balls without knowing the arrangement. Which principle?`],invariant:[`Repeated moves change numbers. Can a state with opposite parity ever be reached? What technique?`,`Every move swaps two tokens. Prove a board pattern impossible. What would you seek?`,`A process asks whether a target configuration is reachable. Look for something unchanged: name the concept.`],monovariant:[`Prove a repeated integer operation cannot run forever. Seek a quantity that always decreases. Name the tool.`,`Every move reduces a positive integer measure. Which proof concept?`,`A sorting process always reduces the number of inversions. What type of quantity?`],game:[`Two players alternately decrease heaps; whoever cannot move loses. How do you analyse positions?`,`You need a reply to every opponent move to force a win. Name a game technique.`,`Classify states with no legal moves and work backwards. What concept?`],vieta:[`Given a quadratic, find the sum/product of its roots without solving it. Name the theorem.`,`Roots $r,s$ of $x^2-${v}x+${w}$ satisfy a useful relation. What tool?`,`The roots of a quadratic are unknown, but their symmetric sums are needed. What technique?`],disc:[`A quadratic must have no real solutions. Which expression's sign matters?`,`Determine whether a parabola crosses the $x$-axis using only $a,b,c$. What tool?`,`How many distinct real roots does $ax^2+bx+c$ have? Name the test.`],similar:[`Parallel lines create equal angles in two triangles. How would you get a side ratio?`,`Two triangles share two equal angles. Which theorem?`,`A length in one triangle must be scaled to another. Look for what relationship?`],circum:[`Find a point equally distant from three non-collinear vertices. What geometric centre?`,`An equidistant point in a right triangle is needed. Which midpoint?`,`A point must be equidistant from $A,B,C$. Intersect which two lines?`],parity:[`A process changes integers and you care only about odd/even. What technique?`,`Show an odd sum cannot equal an even sum. Name the simple principle.`,`Study whether the number of odd entries changes after every move. Which property?`],factor:[`Solve integer solutions of $x^2-y^2=${v}$. What first step?`,`An integer equation has difference of squares. Which algebra technique?`,`Turn $ab+ac$ into a product before enumerating divisors. Name the operation.`],finite:[`A polynomial is integer-valued at all integers. Which discrete tool can analyze it?`,`A polynomial sequence has a constant third difference. Which idea?`,`Try the basis $\\binom{x}{k}$ for integer-valued polynomials. Which topic?`],coordinates:[`Find $(x,y)$ equally distant from coordinate points. What equations would you write?`,`Point $(x,y)$ lies on perpendicular bisectors. Which method can solve it algebraically?`,`Subtract two squared-distance equations to remove squares. Which branch of geometry?`]};let prompt=prompts[skill.id][variant];return {id:`recognition:${seed}`,topic:skill.name,prompt,skill:skill.id,recognition:true,answer:skill.name,hint:skill.trigger,solution:skill.first,keywords:skill.syn,first:skill.first}}
function nextQ(mid){let seed=state.seed++;let q;if(mid==='recognition')q=recognitionQ(seed+2100);else {let pool=mid==='counting'?['mod','stars','complement','paths','parity','factor','inclex','comb','handshakes','prob','pigeon']:mid==='geometry'?['vieta','disc','circum','similar','coords','geomArea','factor']:mid==='proof'?['game','invariant','monovariant','double','pigeon','finite','similar']:['mod','stars','complement','paths','circum','vieta','inclex','coords'];let r=rand(seed+hash(mid));let which=pool[ir(r,0,pool.length-1)];if(mid==='proof')q=proofQ(which,seed);else q=generators[which](r);q.id=`${mid}:${which}:${seed}`;q.recognition=false;}state.question=q;state.hint=0;state.revealed=false;state.answer='';state.stamp=Date.now();state.seen[q.id]=true;save()}
function proofQ(skill,seed){let r=rand(seed+991);let n=ir(r,5,22);const problems={game:{prompt:`Two players alternate reducing exactly one coordinate of $(a,b)$ to a smaller nonnegative integer. A player unable to move loses. Explain how to decide whether $(0,${n})$ is winning and describe a winning first move if one exists.`,keywords:['winning','losing','move','zero','reduce'],solution:`$(0,${n})$ is winning: reduce the positive coordinate to $0$ immediately, leaving $(0,0)$, a terminal losing position. The proof must identify the terminal position and a legal move into it.`,hint:'Identify the state with no legal moves, then ask who can move there.'},invariant:{prompt:`You start with $(a,b)=(2,4)$ and may change $(a,b)$ to $(a+2,b-2)$ whenever both entries remain nonnegative. Explain why $(3,3)$ is unreachable.`,keywords:['parity','odd','even','invariant','unchanged','mod'],solution:`Each move changes $a$ by $2$, so $a$ stays even. The target has $a=3$ odd and is unreachable.`,hint:'Look at the parity of one coordinate after a move.'},monovariant:{prompt:`A positive integer $N$ is replaced by a strictly smaller positive integer at each turn. Explain rigorously why this process must terminate.`,keywords:['decrease','positive','bounded','minimum','integer','terminate','well order'],solution:`$N$ is a positive integer that strictly decreases each turn. There cannot be an infinite descending sequence of positive integers (well-ordering), so the process terminates.`,hint:'Use a property of positive integers, not of real numbers.'},double:{prompt:`In any finite simple undirected graph, explain why the sum of degrees equals twice the number of edges.`,keywords:['edge','endpoint','twice','count','degree'],solution:`Count vertex-edge incidences. Summing vertex degrees counts every incident pair. Each edge has exactly two endpoints, so contributes exactly twice.`,hint:'Count the same incidences from vertices and from edges.'},pigeon:{prompt:`Explain why, among ${n+12} integers, two have the same remainder when divided by ${n}.`,keywords:['remainder','boxes','pigeon','category','mod'],solution:`There are only ${n} possible remainders ($0$ through $${n-1}$), but ${n+12} integers. By pigeonhole, two share a remainder.`,hint:'How many possible remainders can one integer have?'},finite:{prompt:`Let $f(x)=x^2$. Explain why the second forward difference $f(x+2)-2f(x+1)+f(x)$ is constant, and find its value.`,keywords:['expand','difference','2','constant','quadratic'],solution:`Expand $(x+2)^2-2(x+1)^2+x^2=2$. The degree drops by one with each forward difference, making the second difference constant.`,hint:'Expand the three squares and cancel like terms.'},similar:{prompt:`Two triangles have corresponding angles equal. Explain why their corresponding side ratios are equal, and state the theorem used.`,keywords:['similar','aa','angle','ratio','proportion'],solution:`By AA similarity, the triangles are similar. Corresponding sides share one scale factor, so their ratios match.`,hint:'Use the two equal angle pairs.'}};return {id:`proof:${seed}`,topic:'Proof strategy · '+skill,skill,proof:true,...problems[skill]}}
function normalized(s){return s.toLowerCase().replace(/[^a-z0-9,.-]+/g,' ').trim()}function evalQ(q,text){const v=normalized(text);if(q.recognition){let concept=concepts.find(c=>c.id===q.skill);let hit=concept.syn.some(a=>v.includes(normalized(a)))||v.includes(normalized(concept.name));let first=v.length>=37&&(/first|start|would|find|use|look|count|set|check|reduce|write|compute|draw|compare|identify|mark|construct|solve|apply|choose|subtract|split|classify|sum|line|modulo/.test(v));return {ok:hit,base:hit?(first?100:85):0,detail:hit?first?'Technique and first move recognized.':'Correct technique; add a first move to earn full credit.':'Technique not recognized. Review the trigger and retry a variant.'}}if(q.proof){let hits=q.keywords.filter(w=>v.includes(normalized(w))).length;let score=Math.min(100,hits*25+(v.length>85?15:0));return {ok:score>=70,base:score,detail:'Automated proof scoring is approximate: keyword coverage is not a mathematical proof. Compare your explanation with the model argument below and self-assess.'}}let a=v.replaceAll(' ','').replace(/[()]/g,''),b=normalized(q.answer).replaceAll(' ','').replace(/[()]/g,'');let numeric=Number(a),target=Number(b),ok=(a===b)||(a!==''&&Number.isFinite(numeric)&&Number.isFinite(target)&&Math.abs(numeric-target)<1e-7);return {ok,base:ok?100:0,detail:ok?'Exact answer matched. Review the reasoning before continuing.':'Answer did not match. Check the full solution, then try a fresh variant.'}}
function modulePage(){let m=modules.find(x=>x.id===state.view);let r=rec(m.id);if(!state.question||!state.question.id.startsWith(m.id+':'))nextQ(m.id);let q=state.question,remaining=Math.max(0,Math.floor((Date.now()-state.stamp)/1000));return `<div class="card"><div class="split"><div><div class="eyebrow">${html(m.name)}</div><h1>${html(q.recognition?'Rapid recall':q.proof?'Proof laboratory':'Solve independently')}</h1></div><div class="timer" id="elapsed">${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}</div></div><p class="muted">${html(m.description)}</p><div class="split"><span class="pill">Attempt ${r.n+1} · ${html(q.topic)}</span><span class="pill ${passed(modules.indexOf(m))?'ok':'warn'}">Mastery ${mastery(m.id)}% / ${m.threshold}%</span></div><div class="progress"><div style="width:${progress(m)}%"></div></div><p class="mini">Requires ${m.need} attempts and ${m.threshold}% average across your last 10. ${q.recognition?'Target: 15–30 seconds per card. Explain technique + first move.':'Try independently before requesting hints.'}</p></div><div class="card"><div class="eyebrow">Question</div><div class="question">${q.prompt}</div><div style="margin-top:18px"><label for="response"><b>${q.recognition?'Technique + first move':q.proof?'Your proof outline':'Your exact answer'}</b></label><textarea id="response" class="answer" rows="${q.recognition?2:q.proof?6:2}" placeholder="${q.recognition?'e.g. Use ..., first ...':q.proof?'Write the argument in your own words.':'Type a number or x,y'}" ${state.revealed?'disabled':''}>${html(state.answer)}</textarea></div><div class="actions">${state.revealed?`<button class="primary" id="next">Next unseen variant →</button>`:`<button class="primary" id="check">Submit answer</button><button id="hint">${state.hint?'More help':'Show hint'} (-15 points)</button>`}<button id="skip" class="ghost">Skip (-100)</button></div><div id="fb">${state.revealed?resultMarkup(q):state.hint?`<div class="feedback neutral"><b>Hint ${state.hint}</b><p>${state.hint===1?q.hint:q.recognition?q.solution:q.solution||'Try a small example.'}</p></div>`:''}</div></div>${passed(modules.indexOf(m))?`<div class="card"><b>Mastery gate passed.</b> You can unlock the next stage from the navigation. <button class="smallbtn primary" id="continue">Continue →</button></div>`:''}`}
function resultMarkup(q){let result=state.lastResult||{base:0,final:0,detail:''};return `<div class="feedback ${result.final>=80?'good':'bad'}"><b>Score: ${result.final}/100</b> <span class="mini">(${state.hint} hint${state.hint===1?'':'s'} used)</span><p>${html(result.detail)}</p><details open><summary>Reference reasoning</summary><p>${q.solution||''}</p>${q.recognition?`<p class="mini">Recognition trigger: ${html(concepts.find(c=>c.id===q.skill).trigger)}</p>`:''}</details>${q.proof?`<div class="actions"><button class="smallbtn" id="selfGood">My proof was rigorous</button><button class="smallbtn" id="selfBad">I missed the key step</button></div>`:''}</div>`}
function record(mid,score,full){let r=rec(mid);r.n++;r.score+=score;r.correct+=full?1:0;r.recent.push(score);if(r.recent.length>10)r.recent.shift();state.records[mid]=r;save()}
function check(skip=false){let q=state.question;if(state.revealed)return;let t=document.getElementById('response')?.value||'';if(!skip&&!t.trim()){document.getElementById('response').focus();return}state.answer=t;let ev=skip?{ok:false,base:0,detail:'Skipped; review the solution and solve a new variant.'}:evalQ(q,t);let final=Math.max(0,ev.base-state.hint*15);state.lastResult={...ev,final};state.revealed=true;record(state.view,final,final===100);render()}
function events(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.view=b.dataset.open;state.question=null;render()});let checkB=document.getElementById('check');if(checkB)checkB.onclick=()=>check();let next=document.getElementById('next');if(next)next.onclick=()=>{nextQ(state.view);render()};let hint=document.getElementById('hint');if(hint)hint.onclick=()=>{state.answer=document.getElementById('response').value;state.hint=Math.min(2,state.hint+1);render()};let skip=document.getElementById('skip');if(skip)skip.onclick=()=>check(true);let cont=document.getElementById('continue');if(cont)cont.onclick=()=>{let i=modules.findIndex(m=>m.id===state.view);if(i<modules.length-1&&unlocked(i+1)){state.view=modules[i+1].id;state.question=null;render()}};let selfGood=document.getElementById('selfGood');if(selfGood)selfGood.onclick=()=>{selfGood.disabled=true;document.getElementById('selfBad').disabled=true};let selfBad=document.getElementById('selfBad');if(selfBad)selfBad.onclick=()=>{let r=rec(state.view);r.recent[r.recent.length-1]=Math.min(40,r.recent.at(-1));r.score=Math.max(0,r.score-60);save();render()}}
function render(){nav();document.getElementById('main').innerHTML=state.view==='home'?home():state.view==='library'?library():state.view==='history'?history():modulePage();events();latex();if(clock)clearInterval(clock);if(modules.some(m=>m.id===state.view)){clock=setInterval(()=>{let e=document.getElementById('elapsed');if(!e)return;let s=Math.floor((Date.now()-state.stamp)/1000);e.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},1000)}}document.getElementById('resetBtn').onclick=()=>{if(confirm('Delete all locally saved COMC Forge progress?')){localStorage.removeItem(KEY);location.reload()}};render();
</script></body></html>
