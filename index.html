*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}body.dark{--bg:#0e1623;--card:#162338;--text:#edf3fc;--muted:#a2b1c5;--line:#35465f;--accent:#8ab4ff;--soft:#1e3555;--good:#57d79c;--warn:#fac87d;--shadow:none}

dius:16px;padding:19px;box-shadow:var(--shadow)}.number{font-size:29px;font-weight:850;letter-spacing:-1px}.muted{color:var(--muted)}.smalltext{font-size:12px}.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar>div{height:100%;background:var(--accent);border-radius:9px;transition:width .2s}.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0}.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.lesson-card{text-align:left;width:100%;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}.lesson-card:hover{border-color:var(--accent);transform:translateY(-1px)}.pill{font-size:11px;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 8px;display:inline-block}.pill.good{border-color:var(--good);color:var(--good)}.section{margin:23px 0}.section p{margin:9px 0 0}.example{border-left:4px solid var(--accent);padding:15px 18px;background:var(--soft);border-radius:0 12px 12px 0}.warning{border-left:3px solid var(--warn);padding:10px 15px;margin:16px 0}.problem{margin:14px 0}.problem .question{font-weight:650;font-size:16px}.problem .answerfield{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.problem .answerfield input{flex:1;min-width:180px}.explain{background:var(--soft);padding:14px;border-radius:10px;margin-top:10px;white-space:pre-wrap}.filter{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.footer{border-top:1px solid var(--line);padding:20px 0;margin-top:50px;font-size:12px;color:var(--muted)}.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.checkitem{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}.checkitem input{width:18px;height:18px;accent-color:#2563eb}.hidden{display:none!important}.mobilebar{display:none}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tip{padding:13px 16px;background:var(--soft);border-radius:10px}.reading{max-width:850px}.reading p{font-size:16px;line-height:1.8}.bullets{margin:8px 0;padding-left:22px}.statline{display:flex;justify-content:space-between;gap:10px}.timer{font-variant-numeric:tabular-nums;font-weight:750}a{color:var(--accent)}code{white-space:normal;color:var(--accent)}@media(max-width:800px){.shell{display:block}.sidebar{display:none;position:fixed;z-index:20;width:min(85vw,320px);box-shadow:0 0 0 999px #0008}.sidebar.open{display:block}.mobilebar{display:flex;position:sticky;top:0;z-index:10;align-items:center;justify-content:space-between;background:var(--card);border-bottom:1px solid var(--line);padding:9px 15px}.main{padding:20px 16px}h1{font-size:30px}}@media print{.sidebar,.mobilebar,.btnrow,.answerfield,.footer,.filter{display:none!important}.shell{display:block}.main{padding:5px}.card{break-inside:avoid;box-shadow:none}}

<script>
const LESSONS=[{"id":"primes","category":"Number theory","title":"Prime factorization","level":1,"goal":"Write numbers uniquely as products of primes and reason with exponents.","sections":[{"title":"The building blocks","body":"A prime is an integer greater than 1 with exactly two positive divisors. Every integer larger than 1 can be written uniquely as a product of primes (up to order). To factor 360, divide by 2 repeatedly, then 3, then 5: 360 = 2³ × 3² × 5. The exponents are a compact record of its multiplication structure."},{"title":"How to factor by hand","body":"Try the smallest prime divisors in order: 2, 3, 5, 7, 11, …. Keep dividing as long as it works. You only need to test possible prime divisors up to the square root of the remaining number. If the remaining number has no such divisor, it is prime."},{"title":"Why it is useful","body":"The prime factorization tells you which integers divide a number, whether it is a perfect power, how many divisors it has, and how to compute the GCD and LCM. Think of each prime exponent as an inventory count."}],"example":"Example: 540 = 2² × 3³ × 5. To test 72 = 2³ × 3², compare exponents: 540 has only two 2s, so 72 does not divide 540.","warning":"Do not assume a number is prime just because it is odd. Also, 1 is not prime.","check":"Can you factor 756 as 2² × 3³ × 7 without multiplying out 756?"},{"id":"divides","category":"Number theory","title":"Divisibility and Euclid’s lemma","level":1,"goal":"Translate divisibility statements into exact algebra.","sections":[{"title":"What a | b means","body":"a | b means there exists an integer k with b = ak. For example 6 | 42, since 42 = 6 × 7. Divisibility is about exact integer quotients, not approximate quotients."},{"title":"Prime-exponent comparison","body":"Suppose a = 2³ × 3 and b = 2⁴ × 3² × 5. Then a | b because every prime exponent required by a is present in b. The reverse is not true."},{"title":"Euclid’s lemma","body":"If a prime p divides ab, then p must divide a or b. This need not hold for composite p: 6 divides 2 × 3 but divides neither 2 nor 3. A useful extension is that if gcd(a,b)=1 and a | bc, then a | c."}],"example":"Example: If 7 | 15x, then 7 does not divide 15. Because 7 is prime, Euclid’s lemma gives 7 | x.","warning":"If a | b and b | c then a | c. But a | (b+c) only follows if a divides both b and c.","check":"Why does p | a² force p | a when p is prime?"},{"id":"gcd","category":"Number theory","title":"GCD and LCM","level":1,"goal":"Find shared factors and smallest common multiples with prime exponents.","sections":[{"title":"GCD as shared inventory","body":"The greatest common divisor is made of the minimum prime exponents. Example: 72 = 2³ × 3² and 120 = 2³ × 3 × 5, so gcd(72,120) = 2³ × 3 = 24."},{"title":"LCM as enough inventory","body":"The least common multiple must have enough of every prime for both numbers: use maximum exponents. For 72 and 120, lcm = 2³ × 3² × 5 = 360."},{"title":"The Euclidean algorithm","body":"A faster method for large numbers uses gcd(a,b)=gcd(b,a mod b). Example: gcd(252,198)=gcd(198,54)=gcd(54,36)=18. Also gcd(a,b) × lcm(a,b)=ab for positive integers."}],"example":"Example: gcd(18,24)=6 and lcm(18,24)=72. Check: 6 × 72 = 18 × 24.","warning":"Do not interchange min and max exponents: minimum is GCD, maximum is LCM.","check":"Find gcd and lcm of 84 and 90."},{"id":"mod","category":"Number theory","title":"Modular arithmetic and remainders","level":2,"goal":"Use residues to avoid huge calculations and prove impossibility.","sections":[{"title":"Remainder classes","body":"a ≡ b (mod m) means m divides a−b. In plain language, a and b leave the same remainder upon division by m. Example: 17 ≡ 2 (mod 5). You may add, subtract and multiply congruences."},{"title":"Powers cycle","body":"Compute successive residues until they repeat. For example 2³ ≡ 1 (mod 7), so 2¹⁰⁰ = (2³)³³ × 2 ≡ 2 (mod 7). Fermat’s little theorem gives a^(p−1) ≡ 1 (mod p) when p is prime and p does not divide a."},{"title":"Quick contradictions","body":"Squares modulo 4 are only 0 or 1. Hence an equation x² ≡ 2 (mod 4) has no integer solution. Try small moduli such as 2, 3, 4, 5, 8, 9 and 11 before expanding huge algebra."}],"example":"Example: 3⁴ = 81 ≡ 1 (mod 5), so 3¹⁰ = (3⁴)² × 3² ≡ 4 (mod 5).","warning":"Do not divide a congruence by a number unless the divisor is invertible modulo m.","check":"Find the remainder of 7²⁰²⁶ when divided by 13."},{"id":"diophantine","category":"Number theory","title":"Integer equations and factor pairs","level":2,"goal":"Solve equations when variables must be integers.","sections":[{"title":"The integrality constraint","body":"An equation can have many real solutions but few integer solutions. Rewrite expressions as products, bound variables, and use divisibility restrictions rather than treating variables as arbitrary reals."},{"title":"Factor the expression","body":"For xy + x + y = n, add 1 to both sides to obtain (x+1)(y+1)=n+1. Now enumerate factor pairs of n+1 and translate back to x and y."},{"title":"Use parity and residues","body":"If x²+y² is odd, exactly one of x,y must be odd. Modulo 4, a square is 0 or 1. If you can exclude all residue patterns, you have proved there are no integer solutions."}],"example":"Example: Find positive x,y with xy+x+y=11. Then (x+1)(y+1)=12; allowable factors ≥2 give (x,y)=(1,5),(2,3),(3,2),(5,1).","warning":"Do not stop after finding one solution when the question says “all solutions.”","check":"Rewrite xy+2x+3y=18 as a product of two shifted variables."},{"id":"factorials","category":"Number theory","title":"Factorials and prime valuations","level":2,"goal":"Count prime factors of n! without calculating factorials.","sections":[{"title":"The point of a valuation","body":"vₚ(N) counts how many copies of prime p divide N. Example: 72=2³×3², so v₂(72)=3 and v₃(72)=2."},{"title":"Why floor divisions work","body":"To count the p factors in N!, count multiples of p once, multiples of p² again (they contain an extra p), and multiples of p³ again, etc. This gives vₚ(N!)=⌊N/p⌋+⌊N/p²⌋+⋯. Stop when the power exceeds N."},{"title":"Factorial quotients","body":"If B! = ∏pᵉ, then (B!)ᵏ divides A! exactly when k e ≤ vₚ(A!) for each prime p in B!. The smallest ratio vₚ(A!)/e controls the greatest integer k."}],"example":"Example: v₅(50!) = ⌊50/5⌋+⌊50/25⌋ = 10+2=12. The 25 and 50 contribute a second factor of 5.","warning":"You stop at the largest prime power at most N; every larger denominator gives zero.","check":"How many factors of 2 occur in 16!?"},{"id":"powers","category":"Number theory","title":"Perfect squares and perfect powers","level":2,"goal":"Recognize squares, cubes and exponents using factorization.","sections":[{"title":"Even exponents","body":"A positive integer is a perfect square exactly when every exponent in its prime factorization is even. It is a perfect cube exactly when every prime exponent is divisible by 3."},{"title":"Perfect powers","body":"For n>1, n=kᵗ with integers k,t≥2 precisely when the GCD of all its prime exponents is at least 2. Example: 1296=2⁴×3⁴=6⁴."},{"title":"Smallest multiplier","body":"To make a square, multiply by the primes whose exponents are odd. For 72=2³×3², multiplying by 2 gives 144=12²."}],"example":"Example: 180=2²×3²×5. Multiplying by 5 makes 900=30².","warning":"Every positive integer is n¹. For nontrivial perfect-power questions you need exponent at least 2.","check":"Find the smallest multiplier that makes 450 a perfect square."},{"id":"counting","category":"Combinatorics","title":"Sum, product and complement rules","level":1,"goal":"Count without listing every outcome.","sections":[{"title":"Addition versus multiplication","body":"If mutually exclusive cases have a and b outcomes, total a+b. If a task consists of one choice followed by b choices, total a×b. Decide whether you are choosing between cases or making sequential decisions."},{"title":"Complement counting","body":"Sometimes unwanted arrangements are easier to count: desired = all − unwanted. Example: three-digit numbers containing at least one 7 can be counted as all three-digit numbers minus those containing no 7."},{"title":"Avoid overcounting","body":"Cases must be disjoint before using addition. If two sets overlap, subtract the intersection. Draw a small example and label outcomes before using a formula."}],"example":"Example: 3 shirts, 4 trousers, 2 hats produce 3×4×2=24 outfits.","warning":"“Or” may require inclusion–exclusion when alternatives overlap.","check":"How many two-digit integers contain at least one digit 7?"},{"id":"perm","category":"Combinatorics","title":"Permutations and ordered arrangements","level":1,"goal":"Count selections when order changes the outcome.","sections":[{"title":"Order matters","body":"Assigning president, vice-president and treasurer among n students gives n(n−1)(n−2) choices. The first role has n options, then fewer options remain."},{"title":"Factorials","body":"n! = n(n−1)…1 counts orders of n distinct objects. Choosing r of n distinct objects in order gives n!/(n−r)!, called nPr."},{"title":"Restrictions","body":"If two people must be next to one another, treat them temporarily as a block, then count internal orders. If an arrangement has forbidden positions, casework or complementary counting may work better."}],"example":"Example: 8P3 = 8×7×6=336 ways to fill three distinct positions.","warning":"Do not use permutations to form an unordered committee.","check":"How many 4-digit strings have no repeated digits? (Leading zero allowed.)"},{"id":"repeat","category":"Combinatorics","title":"Repeated-letter permutations","level":1,"goal":"Correct overcounting caused by identical objects.","sections":[{"title":"Why n! overcounts","body":"If identical letters were labelled, swapping two identical copies would count a duplicate arrangement. A word with n total letters and multiplicities a,b,… has n!/(a!b!…)."},{"title":"A useful shortcut","body":"For a word with r copies of A among n letters and every other letter identical B, the answer is nCr: choose the A positions. This agrees with n!/(r!(n−r)!)."},{"title":"Extra restrictions","body":"If a word must start with a particular letter, fix it first, then arrange the remaining multiset. If identical symbols must be separated, try a gap method."}],"example":"Example: BANANA has 6 letters, three A’s and two N’s, hence 6!/(3!2!)=60.","warning":"Always count each multiplicity carefully. M and m are distinct only if the problem treats them as such.","check":"How many distinct arrangements of LEVEL are possible?"},{"id":"choose","category":"Combinatorics","title":"Combinations and binomial coefficients","level":1,"goal":"Count unordered selections and use symmetry.","sections":[{"title":"Order does not matter","body":"Selecting r items from n distinct items gives nCr = n!/(r!(n−r)!). Divide ordered selections by r!, because each unordered group has r! orders."},{"title":"Combinatorial identities","body":"nCr=nC(n−r), because choosing participants is equivalent to choosing those left out. Pascal: nCr=(n−1)C(r−1)+(n−1)Cr by sorting selections according to whether they contain a particular person."},{"title":"Recognizing combinations","body":"Use combinations for committees, choosing positions, unordered teams, and selecting gaps. Always ask: does rearranging the selected objects change the outcome?"}],"example":"Example: choosing 3 from 8 gives 8C3=(8×7×6)/(3×2×1)=56.","warning":"Using nCr when roles are different omits possible role assignments.","check":"How many 4-student committees can be made from 10 students?"},{"id":"stars","category":"Combinatorics","title":"Stars and bars and grid turns","level":3,"goal":"Count positive and nonnegative integer solutions.","sections":[{"title":"Positive groups","body":"For x₁+⋯+xᵣ=n with each xᵢ≥1, imagine n identical stars in a row. There are n−1 internal gaps; choose r−1 for dividers. Count = (n−1)C(r−1)."},{"title":"Nonnegative groups","body":"For x₁+⋯+xᵣ=n with xᵢ≥0, allow empty groups. The count becomes (n+r−1)C(r−1). One way to derive it is to give each variable one temporary star, apply the positive formula to n+r, and subtract afterward."},{"title":"Turns in grid paths","body":"A shortest grid path alternates runs of right and up. Exactly k turns means k+1 nonempty runs. Split total right steps into the number of right runs and up steps into up runs. Multiply choices and account for starting direction."}],"example":"Example: x+y+z=10 with x,y,z≥1 has 9C2=36 solutions. With nonnegative variables it has 12C2=66.","warning":"Check whether zero is allowed. Mixing positive and nonnegative variables changes the answer.","check":"How many positive solutions are there to a+b+c=12?"},{"id":"pigeon","category":"Combinatorics","title":"Pigeonhole principle","level":2,"goal":"Prove two objects must share a property.","sections":[{"title":"Basic principle","body":"Placing n+1 objects in n boxes forces at least two in one box. More generally at least ⌈N/k⌉ objects share a box if N items fall into k categories."},{"title":"Invent the right categories","body":"Olympiad problems hide the boxes. To prove two integers differ by a multiple of 7, sort by seven remainders. To prove a divisibility relation among numbers 1 through 2n, group by their odd parts."},{"title":"Proof wording","body":"State your objects, identify the boxes, count boxes, then state why the repetition implies the desired result. An example is not a proof of a universal existence claim."}],"example":"Example: among 8 integers, two share a remainder modulo 7, so their difference is divisible by 7.","warning":"You need more objects than boxes to force a collision; equal numbers of each do not suffice.","check":"Among 11 integers, prove two have a difference divisible by 10."},{"id":"inclusion","category":"Combinatorics","title":"Inclusion–exclusion and double counting","level":3,"goal":"Count overlaps and derive identities by two methods.","sections":[{"title":"Two overlapping sets","body":"For finite sets A,B: |A∪B|=|A|+|B|−|A∩B|. The overlap was counted twice and must be subtracted once."},{"title":"Double counting","body":"Count the same collection of pairs in two ways. A graph with E edges has degree sum 2E, since each edge touches two endpoints. This immediately proves the number of odd-degree vertices is even."},{"title":"Binomial identities","body":"The identity Σk k(nCk)=n2^(n−1) counts (subset, distinguished member) first by subset size and second by choosing the distinguished element."}],"example":"Example: of 40 students, 22 study French, 18 Spanish and 7 both. The number studying at least one =22+18−7=33.","warning":"Do not add counts from overlapping categories without correcting double counts.","check":"A class has 25 playing soccer, 18 basketball and 9 both. How many play at least one?"},{"id":"prob","category":"Probability","title":"Elementary probability and sample spaces","level":1,"goal":"Build equally likely outcome spaces before calculating chances.","sections":[{"title":"Basic probability","body":"When equally likely elementary outcomes form the sample space, P(E)=favourable outcomes/total outcomes. Two fair coin flips have HH,HT,TH,TT each probability 1/4; unordered “one of each” has probability 1/2."},{"title":"Independence","body":"Independent events obey P(A and B)=P(A)P(B). A second fair coin flip remains 1/2 regardless of the first. Without replacement from a deck, successive draws are typically dependent."},{"title":"Complements","body":"P(at least one success)=1−P(no successes), often dramatically simpler than adding many cases."}],"example":"Example: the probability of at least one head in three independent fair flips is 1−(1/2)³=7/8.","warning":"Do not treat HH, “one of each”, and TT as three equally likely possibilities.","check":"What is the probability of exactly two heads in three fair flips?"},{"id":"conditional","category":"Probability","title":"Conditional probability and Bayes","level":3,"goal":"Update probabilities after learning an observation.","sections":[{"title":"Restrict the sample space","body":"P(A|B)=P(A∩B)/P(B), assuming P(B)>0. You are not looking at all trials anymore, only those where B occurred."},{"title":"Weighted branches","body":"A fair coin tossed twice produces HH,HT,TH,TT equally likely as ordered results. If your observation favours one branch, the remaining possible cases no longer have equal conditional weight."},{"title":"Bayes as reversal","body":"To infer a cause H from evidence E, calculate P(E|H)P(H), then divide by total probability of E. Enumerating 10 or 100 equally likely elementary outcomes is often easier than memorizing formulas."}],"example":"Example: two fair coin tosses are made. Given at least one is heads, P(HH)=1/3 because the remaining equally likely outcomes are HH,HT,TH.","warning":"Conditional probability is not generally P(A)P(B). Conditional events change the denominator.","check":"Two fair dice are rolled. Given their sum is 7, what is the chance the first die shows 2?"},{"id":"polynomials","category":"Algebra","title":"Factoring and polynomial identities","level":1,"goal":"Manipulate polynomials strategically.","sections":[{"title":"Factor common structure","body":"Look first for common factors, difference of squares a²−b²=(a−b)(a+b), and quadratic trinomials. Substituting a repeated expression can reduce degree."},{"title":"Identity versus equation","body":"An identity holds for all allowed x. Comparing coefficients works in identities; for a single equation, solve or factor instead."},{"title":"Remainder and factor theorems","body":"Dividing polynomial P(x) by x−a leaves remainder P(a). Thus x−a is a factor exactly when P(a)=0."}],"example":"Example: x³−4x = x(x²−4)=x(x−2)(x+2). Its roots are −2,0,2.","warning":"A zero product means at least one factor is zero; a zero sum does not.","check":"Find the remainder when x³+2x+5 is divided by x−2."},{"id":"vieta","category":"Algebra","title":"Vieta’s formulas and roots","level":2,"goal":"Use root sums and products without solving quadratics.","sections":[{"title":"Derive the relationship","body":"If roots are a,b, then A(x−a)(x−b)=Ax²−A(a+b)x+Aab. Compare with Ax²+Bx+C: a+b=−B/A and ab=C/A."},{"title":"Combine with root equations","body":"If a is a root of x²+x−2020=0, then a²=2020−a. Thus a²−b=2020−(a+b)=2021. This avoids square roots entirely."},{"title":"Higher-degree extension","body":"For a monic cubic x³+bx²+cx+d with roots r,s,t, r+s+t=−b, rs+rt+st=c and rst=−d."}],"example":"Example: for x²−7x+10=0, the roots have sum 7 and product 10, even before solving them.","warning":"Pay close attention to the negative sign in the root sum.","check":"If a,b solve x²−5x+6=0, find a²+b²."},{"id":"inequalities","category":"Algebra","title":"AM–GM and Cauchy–Schwarz","level":3,"goal":"Bound expressions and prove optimality.","sections":[{"title":"Nonnegative squares","body":"(a−b)²≥0 implies a²+b²≥2ab. Rearranging gives AM–GM: for a,b≥0, (a+b)/2≥√(ab), with equality when a=b."},{"title":"Fixed-sum products","body":"If x+y=S and x,y≥0, then xy≤S²/4. For integer x,y the best product occurs when x,y are as close as possible. This is often the hidden tool in game and optimization problems."},{"title":"Cauchy and Engel form","body":"For positive aᵢ, (Σxᵢ²/aᵢ)(Σaᵢ)≥(Σxᵢ)². Useful for sums of fractions with squared numerators. Always check equality conditions before claiming a maximum or minimum is attained."}],"example":"Example: if x+y=20 and x,y≥0, then xy≤100 with equality x=y=10.","warning":"An upper bound is not automatically achievable under integer or other constraints.","check":"For positive integers a+b=19, what is the largest possible product ab?"},{"id":"sequences","category":"Algebra","title":"Sequences, recurrences and induction","level":2,"goal":"Recognize progression patterns and prove formulas.","sections":[{"title":"Arithmetic versus geometric","body":"Arithmetic sequences add a fixed difference d: aₙ=a₁+(n−1)d. Geometric sequences multiply by fixed ratio r: aₙ=a₁r^(n−1)."},{"title":"Summation shortcuts","body":"1+2+⋯+n=n(n+1)/2. A geometric sum is a(1−rⁿ)/(1−r) when r≠1."},{"title":"Induction","body":"Prove the first case, then assume a statement at n and derive it at n+1. Strong induction allows all earlier values, ideal for recursive and factorization problems."}],"example":"Example: 3+6+12+24+⋯+3·2⁹=3(2¹⁰−1)=3069.","warning":"Be clear whether indexing begins at 0 or 1.","check":"Find 1+3+5+⋯+39."},{"id":"functions","category":"Algebra","title":"Functional equations and degree comparison","level":4,"goal":"Extract restrictions from substitutions and highest-degree terms.","sections":[{"title":"Substitute special values","body":"For P(x+y)=P(x)+P(y), set x=y=0 to get P(0)=0, then y=x to get P(2x)=2P(x). Small inputs often reveal the structure."},{"title":"Compare degrees","body":"If nonzero polynomial P has leading term axⁿ, then P(2x) has leading coefficient 2ⁿa, whereas 2P(x) has 2a. Thus 2ⁿ=2 and n=1. Verify candidates afterward."},{"title":"A quadratic variant","body":"For P(x+y)=P(x)+P(y)+2xy, subtract x²: Q(x)=P(x)−x² satisfies Q(x+y)=Q(x)+Q(y). Hence polynomial solutions are P(x)=x²+cx."}],"example":"Example: all polynomial P satisfying P(x+y)=P(x)+P(y) are P(x)=cx, including c=0.","warning":"Proving a candidate satisfies the equation is not enough: exclude every other polynomial.","check":"If P is a polynomial and P(2x)=4P(x), what possible degree can nonzero P have?"},{"id":"triangle","category":"Geometry","title":"Triangles, angles, similarity and area","level":2,"goal":"Recognize angles and ratios before using equations.","sections":[{"title":"Core facts","body":"Triangle angles sum to 180°. An exterior angle equals the sum of the remote interior angles. Isosceles triangles have equal base angles. Pythagoras applies only to right triangles."},{"title":"Similar triangles","body":"AA similarity gives equal corresponding angles and a common side-length ratio. Areas scale as the square of the length ratio; if sides scale 3:5, areas scale 9:25."},{"title":"Area and coordinates","body":"Triangle area is base×height/2. Coordinate geometry lets you use slopes, distances, and the shoelace determinant when pictures are awkward."}],"example":"Example: similar triangles have corresponding sides 4 and 10. Their areas have ratio 4²:10² = 4:25.","warning":"Never assume a diagram is drawn to scale or that a line is perpendicular without a reason.","check":"A triangle has angles 2x,3x,4x. Find x."},{"id":"circles","category":"Geometry","title":"Circles, chords and tangents","level":3,"goal":"Use circle geometry facts confidently.","sections":[{"title":"Tangent–radius right angles","body":"A tangent meets a circle at 90° to the radius drawn to the contact point. This creates right triangles with Pythagoras and trigonometry."},{"title":"Chords and central angles","body":"A perpendicular from the centre to a chord bisects it. The central angle subtending an arc is twice the inscribed angle on the same arc."},{"title":"Power of a point","body":"Two secants from an external point satisfy PA·PB=PC·PD using near/far intersections; a tangent and secant satisfy PT²=PA·PB. These come from similar triangles."}],"example":"Example: if a circle has radius 13 and a chord lies 5 units from the centre, half the chord is √(13²−5²)=12; chord length 24.","warning":"Tangent length is not the radius. Draw the radius to the contact point and form a right triangle.","check":"A circle has radius 10 and a chord 6 units from the centre. Find the chord length."},{"id":"coordinate","category":"Geometry","title":"Coordinate geometry and transformations","level":2,"goal":"Turn geometric constraints into equations.","sections":[{"title":"Distances and slopes","body":"Distance between (x₁,y₁),(x₂,y₂) is √((x₂−x₁)²+(y₂−y₁)²). Midpoint averages coordinates; slope is Δy/Δx for nonvertical lines."},{"title":"Parallel and perpendicular","body":"Parallel nonvertical lines have equal slopes. Perpendicular nonvertical lines have slopes with product −1. Vertical and horizontal lines are perpendicular."},{"title":"Smart coordinates","body":"Place a right angle at (0,0), one side on each axis, or a circle centre at the origin. Good coordinate choices eliminate unnecessary algebra."}],"example":"Example: between (1,2) and (7,10), distance = √(6²+8²)=10.","warning":"A vertical line has undefined slope, not slope 0.","check":"Find the distance between (−2,3) and (4,11)."},{"id":"trig","category":"Geometry","title":"Trigonometry and exact angles","level":2,"goal":"Use special triangles and trig identities without a calculator.","sections":[{"title":"Right-triangle ratios","body":"sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse, tan θ = opposite/adjacent. In a 30–60–90 triangle, sides are 1:√3:2; in a 45–45–90 triangle, 1:1:√2."},{"title":"Key identities","body":"sin²θ+cos²θ=1, tanθ=sinθ/cosθ. Know exact values at 0°,30°,45°,60°,90°. Draw a special triangle rather than memorizing isolated decimals."},{"title":"Circle applications","body":"A tangent creates a 90° angle with a radius; combining a distance and radius often gives an exact sine or cosine, then a required angle difference."}],"example":"Example: if a right triangle has hypotenuse 10 and side opposite θ equal to 5, acute θ=30°.","warning":"Check whether angles are in degrees or radians and which side is opposite the named angle.","check":"In a right triangle with hypotenuse 12 and opposite side 6, find the acute angle."},{"id":"invariants","category":"Proof techniques","title":"Invariants and monovariants","level":4,"goal":"Analyze repeated moves without enumerating sequences.","sections":[{"title":"Invariant","body":"A quantity preserved by every legal move is an invariant. Common choices are parity, residues, a weighted sum, or difference between piles modulo m. If starting and ending states have different invariant values, the ending state is impossible."},{"title":"Monovariant","body":"A quantity that strictly rises or falls can prove a process terminates or a cycle is impossible. Examples include the number of objects, sum of squared pile sizes, or number of inversions."},{"title":"Build a rigorous proof","body":"State the candidate quantity, check every type of move, calculate the initial and target values, and then derive the result. Simply trying many moves cannot prove impossibility."}],"example":"Example: repeatedly adding 2 to an integer preserves parity. Starting at 3, you cannot reach 20.","warning":"An invariant must survive EVERY allowed move, not just the moves in one sample path.","check":"Starting at 1, each move adds 4 or subtracts 8. Can you reach 18? Explain with a remainder."},{"id":"extremal","category":"Proof techniques","title":"Extremal principle and proof-writing","level":4,"goal":"Find largest/smallest objects and prove optimality.","sections":[{"title":"Extremal principle","body":"In a finite nonempty set, choose the smallest or largest object. Show that the problem conditions force an even smaller or larger one, obtaining a contradiction."},{"title":"Proving a minimum","body":"A minimum proof has two parts: (1) establish that fewer steps cannot work (lower bound), and (2) explicitly construct a process attaining the bound. Only doing one part is incomplete."},{"title":"Proof templates","body":"For existence, give a valid construction. For impossibility, eliminate every alternative. For all integer solutions, prove necessity and then check sufficiency. Clear definitions and quantified statements matter as much as clever calculations."}],"example":"Example: to prove every degree sequence of n vertices repeats a degree, notice 0 and n−1 cannot both appear. There are at most n−1 available degree values for n vertices.","warning":"Numerical experiments support conjectures but do not establish a proof for every n.","check":"If x and y are positive integers with x+y=11, what is the maximum possible xy?"}];
const PROBLEMS=[{"id":"p001","topic":"primes","q":"Write 72 as a product of prime powers.","a":"2^3 × 3^2","ex":"Divide 72 by successive primes. The collected factors give 2^3 × 3^2.","hint":"Start by dividing by 2 as many times as possible.","level":"A"},{"id":"p002","topic":"divides","q":"Does 6 divide 12? Answer yes or no.","a":"yes","ex":"12=6 × 2, an integer multiple.","hint":"Find an integer quotient.","level":"A"},{"id":"p003","topic":"gcd","q":"Find gcd(36,60).","a":"12","ex":"The common prime powers form the GCD. Euclidean algorithm gives gcd(36,60)=12.","hint":"Repeatedly replace (a,b) with (b, remainder).","level":"A"},{"id":"p004","topic":"mod","q":"Find the remainder of 2^5 when divided by 7.","a":"4","ex":"Reduce successive powers modulo 7; 2^5 ≡ 4 (mod 7).","hint":"Look for a repeating power cycle.","level":"B"},{"id":"p005","topic":"diophantine","q":"How many ordered positive integer pairs (x,y) solve xy+x+y=11?","a":"4","ex":"(x+1)(y+1)=12. Every positive x,y corresponds to a divisor x+1 of 12 strictly between 1 and 12; there are 4.","hint":"Add 1 and factor (x+1)(y+1).","level":"B"},{"id":"p006","topic":"factorials","q":"How many factors of 2 occur in 10!?","a":"8","ex":"Add floors ⌊10/2⌋+⌊10/2²⌋+⋯. The total is 8.","hint":"Count multiples of p, then multiples of p², etc.","level":"B"},{"id":"p007","topic":"powers","q":"Find the smallest positive integer m such that 12m is a perfect square.","a":"3","ex":"Factor 12. To make every exponent even, multiply by the primes with odd exponents: m=3.","hint":"Write the prime factorization and fix odd exponents.","level":"A"},{"id":"p008","topic":"counting","q":"A student has 2 shirts, 3 pairs of trousers and 2 hats. How many outfits choose one of each?","a":"12","ex":"Multiply independent choices: 2×3×2=12.","hint":"A multi-stage choice calls for multiplication.","level":"A"},{"id":"p009","topic":"perm","q":"How many ways can 2 different ranked prizes be given to 2 distinct students among 5 students, with at most one prize per student?","a":"20","ex":"Order matters, so use 5P2=20.","hint":"Fill the first role, then the next.","level":"A"},{"id":"p010","topic":"repeat","q":"How many distinct strings contain exactly 2 A’s, 2 B’s and 1 C’s?","a":"30","ex":"There are 5 symbols. Divide 5! by 2!2!1! to correct rearrangements of identical copies. Answer: 30.","hint":"Use the multiset permutation formula.","level":"B"},{"id":"p011","topic":"choose","q":"How many unordered groups of 2 can be chosen from 7 distinct people?","a":"21","ex":"Order does not matter, so choose 7C2=21.","hint":"A group is unchanged by reordering its members.","level":"A"},{"id":"p012","topic":"stars","q":"How many ordered positive integer solutions are there to x₁+⋯+x_2=7?","a":"6","ex":"Arrange 7 stars and choose 1 divider positions among 6 internal gaps: C(6,1)=6.","hint":"All variables are positive: count gaps between stars.","level":"B"},{"id":"p013","topic":"pigeon","q":"You select 5 integers. Prove that at least two have the same remainder modulo 4. What is the number of remainder classes?","a":"4","ex":"The possible remainders modulo 4 are 0 through 3, exactly 4 classes. Since 5>4, pigeonhole forces a repeated class.","hint":"Identify the boxes as remainder classes.","level":"B"},{"id":"p014","topic":"inclusion","q":"In a class, 14 study French, 11 study Spanish, and 3 study both. How many study at least one?","a":"22","ex":"Add the two counts and subtract the double-counted intersection: 14+11−3=22.","hint":"Use inclusion–exclusion.","level":"A"},{"id":"p015","topic":"prob","q":"2 independent fair coins are flipped. Give the probability of exactly 1 heads as a reduced fraction.","a":"1/2","ex":"Choose which 1 of 2 flips are heads: C(2,1)=2. Out of 2^2 equally likely strings, probability 2/4; reduce.","hint":"Count strings with exactly k heads and divide by all strings.","level":"B"},{"id":"p016","topic":"conditional","q":"A fair 3-sided die numbered 1 to 3 is rolled. Given the result is in {1,2,…,2}, what is P(result=1)?","a":"1/2","ex":"Conditioning removes outcomes 3 through 3. The 2 remaining faces are equally likely, and one equals 1.","hint":"Restrict the sample space to the observed event.","level":"A"},{"id":"p017","topic":"polynomials","q":"Find the remainder when P(x)=x³+3x+5 is divided by x−2.","a":"19","ex":"By the remainder theorem the remainder is P(2)=2³+3×2+5=19.","hint":"Evaluate P at the root of the divisor.","level":"A"},{"id":"p018","topic":"vieta","q":"If a,b are roots of x²−5x+3=0, find a²+b².","a":"19","ex":"Vieta gives a+b=5, ab=3. Thus a²+b²=(a+b)²−2ab=5²−2×3=19.","hint":"Use sum and product rather than individual roots.","level":"B"},{"id":"p019","topic":"inequalities","q":"Positive integers a,b satisfy a+b=13. What is the greatest possible value of ab?","a":"42","ex":"For fixed sum, the product is largest when integers are as equal as possible: 6×7=42.","hint":"Balance the numbers as closely as possible.","level":"A"},{"id":"p020","topic":"sequences","q":"Find the sum of the first 10 positive odd integers.","a":"100","ex":"The first 10 odd numbers sum to 10²=100; one proof pairs successive square numbers, another uses arithmetic-series summation.","hint":"Draw successive square grids or use an arithmetic sequence.","level":"A"},{"id":"p021","topic":"functions","q":"A nonzero polynomial P satisfies P(2x)=2P(x) for every real x. What is its degree?","a":"1","ex":"If P has leading term axⁿ, compare leading coefficients: 2ⁿa=2a, so n=1.","hint":"Write only the highest power axⁿ and compare both sides.","level":"B"},{"id":"p022","topic":"triangle","q":"The three angles of a triangle are 2x°, 3x°, 4x°. Find x in degrees (fraction allowed).","a":"20","ex":"Triangle angles sum to 180°, so (2+3+4)x=9x=180 and x=180/9.","hint":"Set the angle sum equal to 180°.","level":"A"},{"id":"p023","topic":"circles","q":"A circle has radius 5 and a chord is 3 units from the centre. Find the chord length.","a":"8","ex":"A perpendicular from the centre bisects the chord. Half-length √(5²−3²)=4. Full chord 8.","hint":"Draw a right triangle from centre to midpoint of chord.","level":"B"},{"id":"p024","topic":"coordinate","q":"Find the distance from (-2,3) to (1,7).","a":"5","ex":"The changes are Δx=3, Δy=4; distance √(3²+4²)=5.","hint":"Use the Pythagorean distance formula.","level":"A"},{"id":"p025","topic":"trig","q":"Find the exact value of sin(30°).","a":"1/2","ex":"The special right triangles give sin 30° = 1/2.","hint":"Use a 30–60–90 or 45–45–90 triangle.","level":"A"},{"id":"p026","topic":"invariants","q":"Starting from 1, each move adds 4 or subtracts 8. Is reaching 2 possible? Answer yes or no.","a":"no","ex":"Both moves change the number by a multiple of 4, preserving its residue mod 4. Start 1 and target 2 differ by 1 modulo 4; impossible.","hint":"Check the number modulo 4 after every move.","level":"C"},{"id":"p027","topic":"extremal","q":"Positive integers x,y have x+y=11. Find their maximum possible product and justify it.","a":"30","ex":"If x≤y−2, replacing (x,y) with (x+1,y−1) increases xy by y−x−1>0. So optimal numbers differ by at most 1; product 30.","hint":"Show an unbalanced pair can be improved.","level":"C"},{"id":"p028","topic":"primes","q":"Write 108 as a product of prime powers.","a":"2^2 × 3^3","ex":"Divide 108 by successive primes. The collected factors give 2^2 × 3^3.","hint":"Start by dividing by 2 as many times as possible.","level":"A"},{"id":"p029","topic":"divides","q":"Does 8 divide 24? Answer yes or no.","a":"yes","ex":"24=8 × 3, an integer multiple.","hint":"Find an integer quotient.","level":"A"},{"id":"p030","topic":"gcd","q":"Find gcd(48,72).","a":"24","ex":"The common prime powers form the GCD. Euclidean algorithm gives gcd(48,72)=24.","hint":"Repeatedly replace (a,b) with (b, remainder).","level":"A"},{"id":"p031","topic":"mod","q":"Find the remainder of 3^7 when divided by 9.","a":"0","ex":"Reduce successive powers modulo 9; 3^7 ≡ 0 (mod 9).","hint":"Look for a repeating power cycle.","level":"B"},{"id":"p032","topic":"diophantine","q":"How many ordered positive integer pairs (x,y) solve xy+x+y=17?","a":"4","ex":"(x+1)(y+1)=18. Every positive x,y corresponds to a divisor x+1 of 18 strictly between 1 and 18; there are 4.","hint":"Add 1 and factor (x+1)(y+1).","level":"B"},{"id":"p033","topic":"factorials","q":"How many factors of 3 occur in 12!?","a":"5","ex":"Add floors ⌊12/3⌋+⌊12/3²⌋+⋯. The total is 5.","hint":"Count multiples of p, then multiples of p², etc.","level":"B"},{"id":"p034","topic":"powers","q":"Find the smallest positive integer m such that 18m is a perfect square.","a":"2","ex":"Factor 18. To make every exponent even, multiply by the primes with odd exponents: m=2.","hint":"Write the prime factorization and fix odd exponents.","level":"A"},{"id":"p035","topic":"counting","q":"A student has 3 shirts, 3 pairs of trousers and 2 hats. How many outfits choose one of each?","a":"18","ex":"Multiply independent choices: 3×3×2=18.","hint":"A multi-stage choice calls for multiplication.","level":"A"},{"id":"p036","topic":"perm","q":"How many ways can 3 different ranked prizes be given to 3 distinct students among 6 students, with at most one prize per student?","a":"120","ex":"Order matters, so use 6P3=120.","hint":"Fill the first role, then the next.","level":"A"},{"id":"p037","topic":"repeat","q":"How many distinct strings contain exactly 3 A’s, 2 B’s and 1 C’s?","a":"60","ex":"There are 6 symbols. Divide 6! by 3!2!1! to correct rearrangements of identical copies. Answer: 60.","hint":"Use the multiset permutation formula.","level":"B"},{"id":"p038","topic":"choose","q":"How many unordered groups of 3 can be chosen from 8 distinct people?","a":"56","ex":"Order does not matter, so choose 8C3=56.","hint":"A group is unchanged by reordering its members.","level":"A"},{"id":"p039","topic":"stars","q":"How many ordered positive integer solutions are there to x₁+⋯+x_3=8?","a":"21","ex":"Arrange 8 stars and choose 2 divider positions among 7 internal gaps: C(7,2)=21.","hint":"All variables are positive: count gaps between stars.","level":"B"},{"id":"p040","topic":"pigeon","q":"You select 7 integers. Prove that at least two have the same remainder modulo 5. What is the number of remainder classes?","a":"5","ex":"The possible remainders modulo 5 are 0 through 4, exactly 5 classes. Since 7>5, pigeonhole forces a repeated class.","hint":"Identify the boxes as remainder classes.","level":"B"},{"id":"p041","topic":"inclusion","q":"In a class, 15 study French, 12 study Spanish, and 4 study both. How many study at least one?","a":"23","ex":"Add the two counts and subtract the double-counted intersection: 15+12−4=23.","hint":"Use inclusion–exclusion.","level":"A"},{"id":"p042","topic":"prob","q":"3 independent fair coins are flipped. Give the probability of exactly 2 heads as a reduced fraction.","a":"3/8","ex":"Choose which 2 of 3 flips are heads: C(3,2)=3. Out of 2^3 equally likely strings, probability 3/8; reduce.","hint":"Count strings with exactly k heads and divide by all strings.","level":"B"},{"id":"p043","topic":"conditional","q":"A fair 4-sided die numbered 1 to 4 is rolled. Given the result is in {1,2,…,2}, what is P(result=1)?","a":"1/2","ex":"Conditioning removes outcomes 3 through 4. The 2 remaining faces are equally likely, and one equals 1.","hint":"Restrict the sample space to the observed event.","level":"A"},{"id":"p044","topic":"polynomials","q":"Find the remainder when P(x)=x³+4x+6 is divided by x−3.","a":"45","ex":"By the remainder theorem the remainder is P(3)=3³+4×3+6=45.","hint":"Evaluate P at the root of the divisor.","level":"A"},{"id":"p045","topic":"vieta","q":"If a,b are roots of x²−6x+4=0, find a²+b².","a":"28","ex":"Vieta gives a+b=6, ab=4. Thus a²+b²=(a+b)²−2ab=6²−2×4=28.","hint":"Use sum and product rather than individual roots.","level":"B"},{"id":"p046","topic":"inequalities","q":"Positive integers a,b satisfy a+b=14. What is the greatest possible value of ab?","a":"49","ex":"For fixed sum, the product is largest when integers are as equal as possible: 7×7=49.","hint":"Balance the numbers as closely as possible.","level":"A"},{"id":"p047","topic":"sequences","q":"Find the sum of the first 11 positive odd integers.","a":"121","ex":"The first 11 odd numbers sum to 11²=121; one proof pairs successive square numbers, another uses arithmetic-series summation.","hint":"Draw successive square grids or use an arithmetic sequence.","level":"A"},{"id":"p048","topic":"functions","q":"A nonzero polynomial P satisfies P(3x)=9P(x) for every real x. What is its degree?","a":"2","ex":"If P has leading term axⁿ, compare leading coefficients: 3ⁿa=9a, so n=2.","hint":"Write only the highest power axⁿ and compare both sides.","level":"B"},{"id":"p049","topic":"triangle","q":"The three angles of a triangle are 3x°, 4x°, 5x°. Find x in degrees (fraction allowed).","a":"15","ex":"Triangle angles sum to 180°, so (3+4+5)x=12x=180 and x=180/12.","hint":"Set the angle sum equal to 180°.","level":"A"},{"id":"p050","topic":"circles","q":"A circle has radius 10 and a chord is 6 units from the centre. Find the chord length.","a":"16","ex":"A perpendicular from the centre bisects the chord. Half-length √(10²−6²)=8. Full chord 16.","hint":"Draw a right triangle from centre to midpoint of chord.","level":"B"},{"id":"p051","topic":"coordinate","q":"Find the distance from (-1,4) to (4,16).","a":"13","ex":"The changes are Δx=5, Δy=12; distance √(5²+12²)=13.","hint":"Use the Pythagorean distance formula.","level":"A"},{"id":"p052","topic":"trig","q":"Find the exact value of sin(45°).","a":"√2/2","ex":"The special right triangles give sin 45° = √2/2.","hint":"Use a 30–60–90 or 45–45–90 triangle.","level":"A"},{"id":"p053","topic":"invariants","q":"Starting from 3, each move adds 4 or subtracts 8. Is reaching 4 possible? Answer yes or no.","a":"no","ex":"Both moves change the number by a multiple of 4, preserving its residue mod 4. Start 3 and target 4 differ by 1 modulo 4; impossible.","hint":"Check the number modulo 4 after every move.","level":"C"},{"id":"p054","topic":"extremal","q":"Positive integers x,y have x+y=12. Find their maximum possible product and justify it.","a":"36","ex":"If x≤y−2, replacing (x,y) with (x+1,y−1) increases xy by y−x−1>0. So optimal numbers differ by at most 1; product 36.","hint":"Show an unbalanced pair can be improved.","level":"C"},{"id":"p055","topic":"primes","q":"Write 180 as a product of prime powers.","a":"2^2 × 3^2 × 5","ex":"Divide 180 by successive primes. The collected factors give 2^2 × 3^2 × 5.","hint":"Start by dividing by 2 as many times as possible.","level":"A"},{"id":"p056","topic":"divides","q":"Does 9 divide 36? Answer yes or no.","a":"yes","ex":"36=9 × 4, an integer multiple.","hint":"Find an integer quotient.","level":"A"},{"id":"p057","topic":"gcd","q":"Find gcd(60,84).","a":"12","ex":"The common prime powers form the GCD. Euclidean algorithm gives gcd(60,84)=12.","hint":"Repeatedly replace (a,b) with (b, remainder).","level":"A"},{"id":"p058","topic":"mod","q":"Find the remainder of 4^10 when divided by 11.","a":"1","ex":"Reduce successive powers modulo 11; 4^10 ≡ 1 (mod 11).","hint":"Look for a repeating power cycle.","level":"B"},{"id":"p059","topic":"diophantine","q":"How many ordered positive integer pairs (x,y) solve xy+x+y=23?","a":"6","ex":"(x+1)(y+1)=24. Every positive x,y corresponds to a divisor x+1 of 24 strictly between 1 and 24; there are 6.","hint":"Add 1 and factor (x+1)(y+1).","level":"B"},{"id":"p060","topic":"factorials","q":"How many factors of 2 occur in 15!?","a":"11","ex":"Add floors ⌊15/2⌋+⌊15/2²⌋+⋯. The total is 11.","hint":"Count multiples of p, then multiples of p², etc.","level":"B"},{"id":"p061","topic":"powers","q":"Find the smallest positive integer m such that 20m is a perfect square.","a":"5","ex":"Factor 20. To make every exponent even, multiply by the primes with odd exponents: m=5.","hint":"Write the prime factorization and fix odd expo ct strings contain exactly 4 A’s, 2 B’s and 2 C’s?","a":"420","ex":"There are 8 symbols. Divide 8! by 4!2!2! to correct rearrangements of identical copies. Answer: 420.","hint":"Use the multiset permutation formula.","level":"B"},{"id":"p308","topic":"choose","q":"How many unordered groups of 5 can be chosen from 18 distinct people?","a":"8568","ex":"Order does not matter, so choose 18C5=8568.","hint":"A group is unchanged by reordering its members.","level":"B"},{"id":"p309","topic":"stars","q":"How many ordered positive integer solutions are there to x₁+⋯+x_5=18?","a":"2380","ex":"Arrange 18 stars and choose 4 divider positions among 17 internal gaps: C(17,4)=2380.","hint":"All variables are positive: count gaps between stars.","level":"B"},{"id":"p310","topic":"pigeon","q":"You select 19 integers. Prove that at least two have the same remainder modulo 15. What is the number of remainder classes?","a":"15","ex":"The possible remainders modulo 15 are 0 through 14, exactly 15 classes. Since 19>15, pigeonhole forces a repeated class.","hint":"Identify the boxes as remainder classes.","level":"B"},{"id":"p311","topic":"inclusion","q":"In a class, 25 study French, 22 study Spanish, and 4 study both. How many study at least one?","a":"43","ex":"Add the two counts and subtract the double-counted intersection: 25+22−4=43.","hint":"Use inclusion–exclusion.","level":"B"},{"id":"p312","topic":"prob","q":"7 independent fair coins are flipped. Give the probability of exactly 5 heads as a reduced fraction.","a":"21/128","ex":"Choose which 5 of 7 flips are heads: C(7,5)=21. Out of 2^7 equally likely strings, probability 21/128; reduce.","hint":"Count strings with exactly k heads and divide by all strings.","level":"B"},{"id":"p313","topic":"conditional","q":"A fair 14-sided die numbered 1 to 14 is rolled. Given the result is in {1,2,…,5}, what is P(result=1)?","a":"1/5","ex":"Conditioning removes outcomes 6 through 14. The 5 remaining faces are equally likely, and one equals 1.","hint":"Restrict the sample space to the observed event.","level":"B"},{"id":"p314","topic":"polynomials","q":"Find the remainder when P(x)=x³+7x+6 is divided by x−13.","a":"2294","ex":"By the remainder theorem the remainder is P(13)=13³+7×13+6=2294.","hint":"Evaluate P at the root of the divisor.","level":"B"},{"id":"p315","topic":"vieta","q":"If a,b are roots of x²−16x+14=0, find a²+b².","a":"228","ex":"Vieta gives a+b=16, ab=14. Thus a²+b²=(a+b)²−2ab=16²−2×14=228.","hint":"Use sum and product rather than individual roots.","level":"B"},{"id":"p316","topic":"inequalities","q":"Positive integers a,b satisfy a+b=24. What is the greatest possible value of ab?","a":"144","ex":"For fixed sum, the product is largest when integers are as equal as possible: 12×12=144.","hint":"Balance the numbers as closely as possible.","level":"B"},{"id":"p317","topic":"sequences","q":"Find the sum of the first 21 positive odd integers.","a":"441","ex":"The first 21 odd numbers sum to 21²=441; one proof pairs successive square numbers, another uses arithmetic-series summation.","hint":"Draw successive square grids or use an arithmetic sequence.","level":"A"},{"id":"p318","topic":"functions","q":"A nonzero polynomial P satisfies P(3x)=9P(x) for every real x. What is its degree?","a":"2","ex":"If P has leading term axⁿ, compare leading coefficients: 3ⁿa=9a, so n=2.","hint":"Write only the highest power axⁿ and compare both sides.","level":"B"},{"id":"p319","topic":"triangle","q":"The three angles of a triangle are 3x°, 6x°, 6x°. Find x in degrees (fraction allowed).","a":"12","ex":"Triangle angles sum to 180°, so (3+6+6)x=15x=180 and x=180/15.","hint":"Set the angle sum equal to 180°.","level":"A"},{"id":"p320","topic":"circles","q":"A circle has radius 37 and a chord is 12 units from the centre. Find the chord length.","a":"70","ex":"A perpendicular from the centre bisects the chord. Half-length √(37²−12²)=35. Full chord 70.","hint":"Draw a right triangle from centre to midpoint of chord.","level":"B"},{"id":"p321","topic":"coordinate","q":"Find the distance from (1,5) to (21,26).","a":"29","ex":"The changes are Δx=20, Δy=21; distance √(20²+21²)=29.","hint":"Use the Pythagorean distance formula.","level":"A"},{"id":"p322","topic":"trig","q":"Find the exact value of sin(60°).","a":"√3/2","ex":"The special right triangles give sin 60° = √3/2.","hint":"Use a 30–60–90 or 45–45–90 triangle.","level":"A"},{"id":"p323","topic":"invariants","q":"Starting from 23, each move adds 4 or subtracts 8. Is reaching 24 possible? Answer yes or no.","a":"no","ex":"Both moves change the number by a multiple of 4, preserving its residue mod 4. Start 23 and target 24 differ by 1 modulo 4; impossible.","hint":"Check the number modulo 4 after every move.","level":"C"},{"id":"p324","topic":"extremal","q":"Positive integers x,y have x+y=22. Find their maximum possible product and justify it.","a":"121","ex":"If x≤y−2, replacing (x,y) with (x+1,y−1) increases xy by y−x−1>0. So optimal numbers differ by at most 1; product 121.","hint":"Show an unbalanced pair can be improved.","level":"C"}];

function normal(s){return String(s).toLowerCase().trim().replaceAll(' ','').replaceAll('×','*').replaceAll('^','^').replaceAll('−','-')}
function equalAnswer(input,ans){let a=normal(input),b=normal(ans);if(a===b)return true;let num=s=>{if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);if(/^[-+]?\d+\/\d+$/.test(s)){let [x,y]=s.split('/').map(Number);return x/y}return NaN};return Number.isFinite(num(a))&&Number.isFinite(num(b))&&Math.abs(num(a)-num(b))<1e-10}
function updateAnswer(id,val,status){state.answers[id]={value:val,status,date:new Date().toISOString()};save()}
function attach(){document.querySelectorAll('[data-topic]').forEach(x=>x.onclick=()=>navigate('lesson',x.dataset.topic));document.querySelectorAll('[data-route],[data-go],[data-back]').forEach(x=>x.onclick=()=>navigate(x.dataset.route||x.dataset.go||x.dataset.back,x.dataset.id));document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let id=b.dataset.check,p=PROBLEMS.find(x=>x.id===id),input=$('input-'+id),val=input.value; if(!val.trim())return;let ok=equalAnswer(val,p.a);updateAnswer(id,val,ok?'correct':'incorrect');reveal[id]=true;let y=window.scrollY;render();window.scrollTo(0,y)});document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{reveal[b.dataset.reveal]=!reveal[b.dataset.reveal];let y=window.scrollY;render();window.scrollTo(0,y)});document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{let id=b.dataset.self;updateAnswer(id,$('input-'+id)?.value||state.answers[id]?.value||'',b.dataset.result);let y=window.scrollY;render();window.scrollTo(0,y)});document.querySelectorAll('[data-bookmark]').forEach(b=>b.onclick=()=>{state.bookmarks[b.dataset.bookmark]=!state.bookmarks[b.dataset.bookmark];save();let y=window.scrollY;render();window.scrollTo(0,y)});document.querySelectorAll('[data-done]').forEach(x=>x.onchange=()=>{state.done[x.dataset.done]=x.checked;save()});if($('markLesson'))$('markLesson').onclick=()=>{state.done[topic]=!state.done[topic];save();let y=scrollY;render();scrollTo(0,y)};if($('saveNote'))$('saveNote').onclick=()=>{state.notes[topic]=$('note').value;save();$('saveNote').textContent='Saved ✓'};if($('searchLessons'))$('searchLessons').oninput=e=>{search=e.target.value;$('lessonResults').innerHTML=libraryCards();document.querySelectorAll('#lessonResults [data-topic]').forEach(x=>x.onclick=()=>navigate('lesson',x.dataset.topic))};if($('groupFilter'))$('groupFilter').onchange=e=>{filterStatus=e.target.value;$('lessonResults').innerHTML=libraryCards();document.querySelectorAll('#lessonResults [data-topic]').forEach(x=>x.onclick=()=>navigate('lesson',x.dataset.topic))};if($('practiceTopic'))$('practiceTopic').onchange=e=>{topic=e.target.value==='all'?'':e.target.value;render()};if($('level'))$('level').onchange=e=>{filterLevel=e.target.value;render()};if($('status'))$('status').onchange=e=>{filterStatus=e.target.value;render()};if($('newMock'))$('newMock').onclick=()=>{mockIds=['A','B','C'].flatMap(level=>PROBLEMS.filter(p=>p.level===level).sort(()=>Math.random()-.5).slice(0,4).map(p=>p.id));mockStart=Date.now();render()};if($('stopMock'))$('stopMock').onclick=()=>{mockStart=0;render()};if($('theme'))$('theme').onclick=()=>{document.body.classList.toggle('dark');state.theme=document.body.classList.contains('dark');save()};if($('print'))$('print').onclick=()=>window.print();if($('export'))$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='comc-mastery-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};if($('import'))$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.answers||!obj.done)throw Error('Not a valid backup');if(confirm('Replace all local progress with this backup?')){state=obj;save();render()}}catch(err){alert(err.message)}};if($('reset'))$('reset').onclick=()=>{if(confirm('Erase ALL local progress and notes?')){localStorage.removeItem(KEY);location.reload()}}}
$('menuButton').onclick=()=>$('sidebar').classList.toggle('open');
if(state.theme)document.body.classList.add('dark');
let hash=decodeURIComponent(location.hash.slice(1)).split('/');if(['dashboard','all','lesson','practice','roadmap','mock','data'].includes(hash[0])){route=hash[0];topic=hash[1]||''}
window.onhashchange=()=>{let p=decodeURIComponent(location.hash.slice(1)).split('/');if(p[0]!==route||p[1]!==topic)navigate(p[0]||'dashboard',p[1])};
setInterval(()=>{if(route==='mock'&&mockStart&&$('timer'))$('timer').textContent=fmtTime(Date.now()-mockStart)},1000);
render();
</script></body></html>
